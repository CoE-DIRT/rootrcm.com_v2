rkpanel"><h3>${E('Pre-submission validator','Validador previo al envío')}</h3><p>${E('Check sample evidence items to see the readiness indicator react.','Marque los documentos de ejemplo para ver el indicador.')}</p><div class="mini-check">${checks.map((x,i)=>`<label><input type="checkbox" data-cred="${i}" ${state.checklist[i]?'checked':''}>${x}</label>`).join('')}</div><div style="margin-top:17px"><div class="scorebar"><span style="width:${ready/5*100}%"></span></div><p style="margin:7px 0 0;font-size:12px">${ready}/5 · ${E('sample readiness checks','controles de ejemplo')}</p></div></div></div><div class="proof-disclosure">${E('Payer API use depends on approved support. Verification cannot guarantee acceptance or faster payer approval.','Las API requieren autorización del pagador. La verificación no garantiza aprobación ni rapidez.')}</div>`}
function reports(){return `${appTitle(E('Reports & sample analytics','Informes y análisis de ejemplo'),E('Interactive presentation of what a customer workspace could report.','Presentación interactiva de informes de clientes.'))}${kpis([[E('Cash visibility','Visibilidad de efectivo'),'92%'],[E('Tracked claim actions','Acciones rastreadas'),'147'],[E('Follow-up queues','Colas de seguimiento'),'8'],[E('Pending evidence reviews','Evidencia pendiente'),'23']])}<div class="dashgrid"><div class="card"><h3>${E('Operational trend','Tendencia operativa')}</h3>${chart([50,65,75,70,78,86,84,101,110,113,123,135])}<p class="note">${E('Synthetic index · no production system connected','Índice sintético · sin sistema real conectado')}</p></div><div class="card"><h3>${E('Download and accountability','Descarga y responsabilidad')}</h3><p>${E('Preview a synthetic, exportable CSV. Final governance must enforce access roles, retention and audit controls.','Previsualice un CSV sintético. La gobernanza final aplicará permisos, retención y auditoría.')}</p>${button(icon('download','sm')+' '+E('Export sample claims','Exportar reclamos de ejemplo'),'export',undefined,'btn small')}</div></div><div class="card"><h3>${E('Planned reporting library','Biblioteca de informes prevista')}</h3><div class="grid g3">${[[E('A/R aging','Antigüedad de CxC'),'clock'],[E('Payer denials','Denegaciones por pagador'),'shield'],[E('CPT economics','Economía por CPT'),'chart'],[E('Provider productivity','Productividad de proveedores'),'users'],[E('Credentialing readiness','Preparación de acreditación'),'file'],[E('Collections & cash','Cobros y efectivo'),'activity']].map(x=>`<div class="rowitem">${icon(x[1])}<strong>${x[0]}</strong></div>`).join('')}</div></div>`}
function account(){return `${appTitle(E('Account & subscription workspace','Cuenta y suscripciones'),E('Designed customer administration — illustrative state only.','Administración de clientes diseñada — solo estado ilustrativo.'))}<div class="grid g2"><div class="card"><span class="overline">${E('DEMO ORGANIZATION','ORGANIZACIÓN DEMO')}</span><h2 style="font-size:29px;margin:11px 0">${esc(state.profile.practice||'Demo Practice Group')}</h2><div class="cardlist">${[[E('Workspace mode','Modo de espacio'),E('Preview / free','Vista previa / gratis')],[E('Billing','Facturación'),E('No payment method','Sin método de pago')],[E('CRM sync','Sincronización CRM'),E('Not connected','No conectado')],[E('Appwrite account','Cuenta Appwrite'),E('No real account','No es una cuenta real')]].map(x=>`<div class="rowitem"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div></div><div class="card"><h2 style="font-size:29px">${E('Experience preferences','Preferencias de experiencia')}</h2><p>${E('Controls below update the full browser demonstration and remember your preference locally.','Los controles actualizan toda la demo y recuerdan la preferencia localmente.')}</p><div class="cardlist"><div class="rowitem"><strong>${E('Language','Idioma')}</strong>${button(state.lang==='en'?'English → Español':'Español → English','language',undefined,'btn secondary small')}</div><div class="rowitem"><strong>${E('Appearance','Apariencia')}</strong>${button(state.theme==='dark'?E('Switch to light','Cambiar a claro'):E('Switch to dark','Cambiar a oscuro'),'theme',undefined,'btn secondary small')}</div></div><div style="margin-top:20px">${link(E('Explore proposed plans →','Explorar planes →'),'pricing','btn')}</div></div></div><section class="section compact" style="padding-bottom:0"><div class="card"><h3>${E('Appwrite + HubSpot + Stripe · implementation boundary','Appwrite + HubSpot + Stripe · límite de implementación')}</h3><p>${E('The real product would create secure organizations in Appwrite, sync appropriate business contacts to HubSpot and confirm Stripe entitlements via verified webhooks. This preview does none of these actions.','El producto real crearía organizaciones en Appwrite, sincronizaría contactos con HubSpot y validaría pagos por Stripe. Esta vista no realiza estas acciones.')}</p></div></section>`}

function modal(){if(!state.modal)return '';let o=state.modal;let body='',heading='';if(o.type==='article'){let x=RESOURCES[Number(o.value)]||RESOURCES[0];heading=E(x[2],x[3]);body=`<span class="overline">${x[1]} · ${E('EDITORIAL PREVIEW','VISTA EDITORIAL')}</span><p>${E(x[4],x[5])}</p><div class="cardlist">${[E('Context and scope','Contexto y alcance'),E('Operational checklist','Lista operativa'),E('Evidence and payer-specific exceptions','Evidencia y excepciones por pagador'),E('Practical next actions','Acciones prácticas siguientes')].map((v,i)=>`<div class="rowitem">${icon('file','sm')}<strong>0${i+1} · ${v}</strong></div>`).join('')}</div><p class="note">${E('This is a table of contents / article preview, not a published clinical or coding guideline.','Es un avance, no una guía clínica o de codificación publicada.')}</p>`}

else if(o.type==='careerInfo'){let x=ROLES[Number(o.value)]||ROLES[0];heading=E(x[0],x[1]);body=`<span class="overline">${E('ROLE CONCEPT · NOT AN OPEN POSITION','PUESTO CONCEPTUAL · SIN VACANTE')}</span><p>${E(x[2],x[3])}</p><p>${E('A verified opening would include required skills, location, employment model, compensation disclosures where required, and a real application link.','Una vacante verificada incluiría requisitos, ubicación, modalidad, información salarial cuando proceda y enlace real.')}</p>${link(E('View careers →','Ver empleos →'),'careers','btn secondary')}`}
else if(o.type==='partnerInfo'){let x=PARTNERS[Number(o.value)]||PARTNERS[0];heading=E(x[1],x[2]);body=`<p>${E(x[3],x[4])}</p><p>${E('Program criteria, referral compensation, agreements and compliance review must be approved before launch.','Los criterios, compensación, acuerdos y cumplimiento requieren aprobación antes del lanzamiento.')}</p>${link(E('Contact partnerships →','Contactar alianzas →'),'contact','btn')}`}
else if(o.type==='assessmentResult'){heading=E('Your operating path · sample recommendation','Su ruta operativa · recomendación de ejemplo');body=`<p>${E('Based on your selections, the recommended first conversation focuses on','Según sus respuestas, la primera conversación se enfocaría en')}: <strong>${esc(state.assessment.pain)}</strong>. ${E('Consider a scoped baseline before making system changes.','Considere una línea base antes de cambiar sistemas.')}</p><div class="grid g2">${link(E('Review proposed solution →','Ver solución propuesta →'),'solutions','btn secondary')}${link(E('Continue to free signup →','Continuar a cuenta gratis →'),'signup','btn')}</div><p class="note">${E('This is a deterministic prototype result, not an algorithm or a diagnosis.','Es un resultado determinista del prototipo, no un algoritmo ni diagnóstico.')}</p>`}
else {heading=E('Prototype information','Información del prototipo');body='<p>'+esc(o.value)+'</p>'}
return `<div class="modal-overlay" data-act="closeOverlay"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal" tabindex="-1"><button class="close" data-act="close" aria-label="${E('Close','Cerrar')}">×</button><h2 id="modal-title">${heading}</h2>${body}</section></div>`}

function evidenceLabel(){return `<span class="review-stamp">${E('UNVERIFIED — CONTENT SLOT','SIN VERIFICAR — ESPACIO DE CONTENIDO')}</span>`}
function slotImage(type,n){return `<div class="visual-slot" role="img" aria-label="${E('Image placeholder pending verified material','Imagen pendiente de material verificado')}"><span class="visual-glyph">${String(n).padStart(2,'0')}</span><span>${esc(type)}</span><small>${E('Image / media placeholder','Espacio para imagen o video')}</small></div>`}
function galleryRail(items,heading,sub=''){return `<div class="rail-top"><div><h3>${heading}</h3>${sub?`<p>${sub}</p>`:''}</div><div class="rail-actions"><button class="mini-icon" data-act="proofNext" data-val="prev" aria-label="${E('Scroll previous','Desplazar atrás')}">‹</button><button class="mini-icon" data-act="proofNext" data-val="next" aria-label="${E('Scroll next','Desplazar adelante')}">›</button><button class="mini-icon" data-act="autoCarousel" aria-label="${state.autoCarousel?E('Pause automatic scrolling','Pausar desplazamiento automático'):E('Play automatic scrolling','Reanudar desplazamiento automático')}">${state.autoCarousel?'Ⅱ':'▶'}</button></div></div><div class="horizontal-rail" data-rail tabindex="0" aria-label="${heading}">${items.join('')}</div>`}
function articleProofCard(kind,i){const isTest=kind==='testimonials',isCase=kind==='cases',isSuccess=kind==='success';const title=isTest?E('Customer voice · '+String(i+1).padStart(2,'0'),'Voz del cliente · '+String(i+1).padStart(2,'0')):isCase?E(...CASE_TITLES[i]):isSuccess?E(...STORY_TITLES[i]):kind==='accreditations'?E('Accreditation file '+String(i+1).padStart(2,'0'),'Expediente de acreditación '+String(i+1).padStart(2,'0')):kind==='licenses'?E('License register '+String(i+1).padStart(2,'0'),'Registro de licencia '+String(i+1).padStart(2,'0')):E('Partnership file '+String(i+1).padStart(2,'0'),'Expediente de alianza '+String(i+1).padStart(2,'0'));
 const role=TESTIMONIAL_ROLES[i%5],topic=TOPICS[i%10];
 const subtitle=isTest?E('Awaiting consented quote from a '+role[0].toLowerCase()+'.','Pendiente de testimonio autorizado de '+role[1].toLowerCase()+'.'):isCase?E(topic[0]+' · baseline, intervention and outcome pending approval',topic[1]+' · línea base, intervención y resultado pendientes'):isSuccess?E('Illustrative topic, not a published client success', 'Tema ilustrativo; no es un éxito de cliente publicado'):kind==='accreditations'||kind==='licenses'?E('Issuer, scope, license or certificate, validity and ownership required','Se requiere emisor, alcance, licencia o certificado, vigencia y responsable'):E('Agreement, permission, logo license and verification required','Se requiere acuerdo, permiso, licencia del logotipo y verificación');
 return `<article class="evidence-card">${slotImage(isTest?E('Testimonial portrait','Retrato de cliente'):isCase?E('Case study media','Medios del caso'):isSuccess?E('Story image','Imagen de historia'):E('Evidence mark','Marca de evidencia'),i+1)}<div class="evidence-inner"><div class="evidence-meta">${evidenceLabel()}<span>${isTest?E(...role):E(...topic)}</span></div><h4>${esc(title)}</h4><p>${esc(subtitle)}</p><button class="text-action" data-act="proofInfo" data-val="${esc(kind+' · '+title)}">${E('Verification details','Detalles de verificación')} ${icon('arrow','sm')}</button></div></article>`
}
function proofGallery(kind){const tab=PROOF_TABS.find(x=>x[0]===kind)||PROOF_TABS[0];if(kind==='compliance')return assurance2();return galleryRail(Array.from({length:tab[3]},(_,i)=>articleProofCard(kind,i)),E(tab[1],tab[2]),E('Prepared design slots—not published client endorsements.','Espacios preparados; no son respaldos de clientes publicados.'))}
function assurance2(){const items=[['HIPAA','U.S. healthcare privacy and security requirements','Requisitos de privacidad y seguridad en EE. UU.','https://www.hhs.gov/hipaa/for-professionals/privacy/guidance/be-aware-misleading-marketing-claims/index.html'],['SOC 2','Independent attestation report; issuance and scope pending','Informe de atestiguamiento; emisión y alcance pendientes','https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services'],['GDPR','Data-protection obligations; approved scheme evidence required','Protección de datos; evidencia del esquema aprobado','https://www.edpb.europa.eu/topics/accountability-and-compliance-tools/certification_en'],['ISO/IEC 27001','Accredited certificate and validity must be verified','Se requiere verificar certificado acreditado y vigencia','https://www.iso.org/standard/27001']];return `<div class="grid g4 assurance-grid">${items.map(([a,en,es,url])=>`<article class="assurance-card"><div class="assurance-mark">${icon('shield')}</div><h3>${a}</h3>${evidenceLabel()}<p>${E(en,es)}</p><a href="${url}" target="_blank" rel="noopener noreferrer" class="text-action">${E('See authoritative guidance','Ver fuente oficial')} ↗</a></article>`).join('')}</div><p class="proof-disclaimer">${E('HIPAA is not an HHS certification; SOC 2 is an attestation, not a certificate. ROOT status is not established in this demo.','HIPAA no es una certificación emitida por HHS; SOC 2 es un informe de atestiguamiento. No se establece el estatus de ROOT en esta demo.')}</p>`}

function chatResponseV3(input){const q=input.toLowerCase();let key=q.match(/spanish|español|idioma/)?'locale':q.match(/denial|ar\b|claim|rechazo|cuentas por/)?'denials':q.match(/credent|enroll|acredit|inscri/)?'credentialing':q.match(/software|ehr|migration|integrat|migrac|sistema/)?'integrations':q.match(/price|plan|billing|subscription|cost|precio|suscrip/)?'plans':q.match(/team|leadership|director|equipo|líder/)?'team':q.match(/consult|talk|contact|hablar|consulta/)?'contact':q.match(/service|rcm|outsourc|mso|servicio/)?'services':'general';const answers={locale:[`Use the EN · ES toggle in the header to switch the whole demonstration.`,`Use el control EN · ES del encabezado para cambiar el idioma.`],denials:[`Explore Denials & A/R for sample claims, owners and aging queues. No real claims are connected.`,`Explore Denegaciones y CxC para datos ficticios.`],credentialing:[`The credentialing module demonstrates payer-specific readiness and document QA—not guaranteed approval dates.`,`El módulo de acreditación muestra documentos y pasos por pagador, sin garantías de aprobación.`],integrations:[`ROOT's approach starts with your existing EHR/PM. Compatibility and downtime need a scoped review; there is no automatic one-click migration.`,`ROOT parte de su EHR/PM actual. Compatibilidad e interrupciones requieren evaluación.`],plans:[`There are five distinct paths: free account, consultation, diagnostic, recurring plan and custom RCM/MSO. Open Commercial Paths to compare.`,`Hay cinco opciones: cuenta gratis, consulta, diagnóstico, plan recurrente y RCM/MSO personalizado.`],team:[`Meet the four named ROOT leaders in the Team section. Portraits await approved photographs.`,`Conozca a los cuatro integrantes de ROOT. Sus retratos están pendientes.`],contact:[`Choose Free Consultation to preview the discovery request. This is offline and cannot book an actual appointment.`,`Abra Consulta gratuita para simular una solicitud. No hace reservas reales.`],services:[`Use the Service  industries:['Medical Specialty RCM Services and Payer Rules | ROOT','Specialty-aware billing, credentialing and practice operations across cardiology, behavioral health, orthopedics and more.','Cardiology, orthopedics, behavioral health and ambulatory surgery services have materially different medical-necessity, authorization and coding demands. The state, specialty and payer planner helps visualize which dependencies should be investigated.'],
 pricing:['Medical Billing Services, Diagnostic and RCM Pricing | ROOT','Compare free discovery, scoped revenue diagnostics, managed billing services and technology-enabled RCM options.','RCM pricing is not a single software subscription for every practice. Service levels, claim volume, aging work, payer mix and system-access requirements influence the final scope. ROOT recommends defined deliverables and written exclusions before engagement.'],
 platform:['Healthcare Revenue Intelligence Platform and DIRT | ROOT','Explore DIRT, an evidence-led healthcare revenue intelligence concept combining payer patterns, denial workflows and operational visibility.','DIRT stands for Data Intelligence for Revenue Transformation. The intended product helps teams connect denial patterns, financial exceptions and operational actions, with human review and traceable ownership rather than unexplained algorithmic decisions.'],
 enrollment:['Provider Credentialing, Enrollment and Medicare Forms | ROOT','Payer enrollment readiness, provider credentialing, documentation QA, license review and application status workflows.','Enrollment requires accurate organizational records, provider identifiers, licenses and payer-specific documentation. Preliminary checks can reduce avoidable rework, but they cannot guarantee payer acceptance, processing times or effective dates.'],
 resources:['RCM Guides, Medicare Forms and Operational Templates | ROOT','Download revenue cycle checklists, A/R tracking templates, payer forms, credentialing resources and billing operational guides.','Use current regulator-hosted source documents for Medicare matters, and distinguish official forms from editable internal working templates. Every public download should communicate intended use, version, legal limitations and related operational controls.'],
 forms:['Official Medicare Forms and Patient Liability Notices | ROOT','Browse verified CMS-hosted ABN, enrollment, EFT, claim, appeals and provider participation forms in one organized directory.','When a Medicare form matters, the issuing agency is the definitive source for current versions, applicability and completion instructions. This library links to the official Centers for Medicare & Medicaid Services pages rather than repackaging out-of-date PDFs.'],
 templates:['Free Medical Billing Templates and RCM Checklists | ROOT','Browse downloadable workflows for denial appeals, legacy A/R, credentialing, payment reconciliation and practice transition.','ROOT workflow templates are drafting aids for project teams. They organize decisions and evidence, but are not substitutes for individualized legal advice, payer manuals or clinical documentation standards.'],
 careers:['Healthcare RCM Careers and Professional Development | ROOT','Explore healthcare revenue cycle operations, payer research, coding quality, analytics and operational technology career pathways.','RCM operations depend on disciplined specialists who can interpret payer requirements, identify recurring patterns and communicate clearly across practices. Explore capability profiles and skill expectations without assuming a listed discipline has an active vacancy.'],
 partnerships:['Healthcare Technology Partnerships and RCM Referrals | ROOT','Learn how practice consultants, software firms and healthcare referral partners may collaborate with ROOT.','Partner relationships require a defensible scope, brand approvals, documented responsibilities and the freedom to recommend the solution that best serves the medical practice. A software compatibility listing does not represent a formal partnership.'],
 team:['ROOT Leadership and Revenue Cycle Operations Team','Meet ROOT leadership and learn about its commitment to accountable revenue operations and practice independence.','A healthcare operations partnership rests on accountable judgment as much as tooling. ROOT leadership emphasizes operational transparency, process improvement, independent advice and evidence-backed decision-making.'],
 company:['About ROOT — Revenue Operations and Outcomes Technology','Discover ROOT’s founder philosophy, RCM operating principles and DIRT vision for accountable healthcare revenue management.','ROOT was founded to investigate the operational causes behind recurring reimbursement problems, not merely increase claim touches. Activity is not accountability; technology is not intelligence; and collections alone do not describe a healthy revenue operation.'],
 founder:['The Soul of ROOT — Founder Philosophy and Mission','Read the founder’s mission for evidence-led healthcare revenue operations, provider independence and responsible technology.','Fix the system behind your revenue. ROOT’s founding philosophy prioritizes investigation, transparent ownership, human judgment and technology that helps healthcare organizations retain control of their systems and decisions.'],
 proof:['Healthcare RCM Testimonials, Qualifications and Evidence | ROOT','Explore ROOT’s evidence review framework for client outcomes, testimonials, credentials and implementation quality.','Claims of performance require verified calculation methods, authorizations, client consent and relevant timelines. This preview separates editorial evidence slots from approved public results.'],
 cases:['Healthcare Revenue Cycle Case Studies and Implementation Methods | ROOT','Case-study frameworks for denial recovery, onboarding, credentialing and revenue cycle process improvement.','An accountable case study starts with a baseline, a constraint and a documented intervention. Outcomes are published only when the relevant client evidence and approval exist.'],
 success:['Healthcare RCM Success Stories and Practice Improvement | ROOT','Read the operational stories behind potential improvements in collections, patient experience, denial prevention and staffing.','Not all practice improvement is captured by a percentage. Stories should show what changed in the workflow, how teams measured progress and which lessons are transferable to other practice models.'],
 security:['Healthcare Data Privacy, Security and Responsible RCM | ROOT','Learn about privacy boundaries, authorized integrations, PHI safeguards and responsible use of AI in healthcare RCM.','Security starts with least-privilege roles, documented access, encryption, logs, safe handling of health information and accountable vendor decisions. No certification or legal compliance status is implied without verified evidence.'],
 contact:['Contact ROOT for Healthcare RCM and Practice Operations','Contact ROOT for a healthcare billing assessment, credentialing discussion or practice operations consultation.','Describe your organization, specialty and operational challenge without sending patient details. A discovery call can clarify which people, systems, payer records and documentation are needed for a scoped review.'],
 how:['RCM Implementation and Practice Transition Lifecycle | ROOT','Explore ROOT’s eight-stage implementation lifecycle from discovery through ongoing process improvement.','An implementation should protect cash flow while documenting system access, staff workflows, aged balances and handoff ownership. A phased transition can reduce disruption when dependencies are tested before changing production operations.']

const V5_FOUNDER_CHAPTERS=[{"title":"Why ROOT Exists","paragraphs":["ROOT was not born from the observation that healthcare organizations need another medical billing company.","It was born from a more uncomfortable question:","Why, after decades of technological advancement, does the American healthcare revenue cycle still depend on fragmented information, repetitive manual intervention, disconnected accountability, and extraordinary human effort simply to collect payment for services already delivered?","Behind every aging claim is a process that failed somewhere.","Behind every avoidable denial is a decision, configuration, communication, or control that may never have been examined.","Behind every reimbursement delay is a chain of responsibilities that may be distributed across people, systems, and organizations without anyone possessing a complete picture.","And behind every healthcare organization struggling financially are professionals who should be spending more of their energy delivering care, serving patients, and strengthening their practices—not continuously fighting the administrative machinery surrounding reimbursement.","ROOT exists because these failures should not be accepted as inevitable.","We believe the problem is not simply that healthcare organizations need more people working their claims. They need better intelligence, better processes, clearer ownership, and operating systems designed to prevent recurring failure.","That is where ROOT begins.","Not at the claim.","At the root of the problem."]},{"title":"The Experience That Shaped Our Conviction","paragraphs":["ROOT carries the accumulated experience of its founder, Muhammad Aftab Shaukat, whose professional journey across U.S. healthcare revenue cycle management, credentialing, practice operations, business analysis, and technology has shaped its underlying philosophy.","That experience was not confined to one department or one function.","It was developed through years of working across the entire revenue lifecycle: understanding how a patient's information enters an organization, how services become charges, how claims move through clearinghouses, how payers adjudicate them, why denials occur, why reimbursements are delayed, and how operational decisions determine financial outcomes.","It includes pursuing complex payer disputes, managing high-volume claim operations, investigating reimbursement discrepancies, coordinating provider enrollment, building analytical reporting structures, training people, managing teams, and redesigning workflows that had become unnecessarily complicated.","It also exposed an uncomfortable reality.","A healthcare organization can employ hardworking, competent people and still operate a fundamentally inefficient revenue system.","People can perform their assigned tasks correctly while the larger system produces poor results.","A claim can be touched repeatedly without being meaningfully advanced.","A report can be accurate without helping anyone make a decision.","A software platform can be technically sophisticated while the workflow surrounding it remains broken.","A billing organization can appear productive while the underlying causes of revenue loss remain unresolved.","These observations shaped ROOT's founding conviction:","Activity is not accountability. Technology is not intelligence. And collecting revenue is not the same as building a healthy revenue operation.","ROOT is the attempt to unite those disciplines rather than continue treating them as unrelated problems."]},{"title":"The Character Behind ROOT","paragraphs":["ROOT reflects a particular way of thinking.","It is analytical without being detached from reality.","It is ambitious without believing that ambition itself constitutes achievement.","It is skeptical of convenient explanations, inherited assumptions, and systems defended merely because they have always existed.","It favors investigation before conclusion.","Evidence before assertion.","Architecture before expansion.","And measurable execution before celebration.","Its founder's working philosophy can be expressed in a simple sequence:","Observe deeply. Question assumptions. Find the cause. Design the solution. Execute deliberately. Measure the result. Improve the system.","ROOT does not aspire to be the organization that always has the quickest answer.","It aspires to be the organization willing to ask the difficult questions necessary to reach the correct answer.","There is persistence in that philosophy.","The persistence to follow a complicated reimbursement issue beyond its first denial.","The willingness to study unfamiliar technology rather than remain limited by current expertise.","The discipline to inspect data down to the transaction level when summary reports conceal the problem.","And the determination to challenge an established operating model when it no longer serves the people depending upon it.","But that character carries a responsibility.","Intellectual ambition must not become endless complexity.","Perfectionism must not delay service delivery.","And technological experimentation must never consume resources without a reasonable path to operational value.","ROOT must be intellectually ambitious and operationally disciplined at the same time."]},{"title":"What We Believe Is Broken","paragraphs":["We do not believe every weakness in American healthcare revenue management is caused by inadequate software or insufficient staff.","Many problems are structural.","Healthcare revenue operations have accumulated layers of administrative complexity that rarely share a unified understanding of what is happening, why it is happening, who is responsible, and what should happen next.","Billing teams work claims.","Credentialing teams manage enrollment.","Front-desk teams collect information.","Clinical teams document services.","Practice managers review performance.","Technology vendors provide systems.","Payers apply reimbursement rules.","Yet these functions often operate with incomplete visibility into one another.","The consequence is a system in which the same underlying mistake may be corrected repeatedly, while the process responsible for producing it remains unchanged.","ROOT challenges five assumptions:","That more claim touches necessarily produce better collections. We believe intelligent prioritization and durable correction matter more than raw activity. 2. That a billing report is the same as financial intelligence. We believe information becomes valuable when it improves a decision or initiates a meaningful action. 3. That technology transformation requires replacing existing software. We believe improvement should begin with the systems and investments a healthcare organization already possesses. 4. That outsourcing requires surrendering operational visibility. We believe an external operating partner should increase transparency, control, and accountability. 5. That recurring revenue problems are simply the cost of doing business. We believe every recurring failure deserves investigation, and every preventable failure deserves an attempt at permanent correction.","Not every denial can be prevented.","Not every underpayment can be recovered.","Not every payer behavior can be controlled.","But uncertainty is not an excuse for operational blindness.","What can be understood should be made visible. What can be measured should be examined. What can be corrected should not be ignored."]},{"title":"Our Mission","paragraphs":["To transform healthcare revenue operations by combining expert execution, operational intelligence, process engineering, and responsible technology—helping healthcare organizations achieve greater financial control, stronger performance, and the freedom to concentrate on patient care.","We pursue this mission through practical services and capabilities: revenue cycle management, credentialing and enrollment, practice operations, revenue analytics, workflow optimization, reimbursement strategy, technology integration, and intelligent automation.","These are not unrelated businesses placed under a common logo.","They are interconnected functions within one healthcare operating philosophy.","Revenue management reveals financial consequences.","Operational analysis reveals their causes.","Process engineering designs corrective action.","Technology makes those improvements measurable, repeatable, and scalable.","Our role is to connect them."]},{"title":"DIRT — The Intelligence Within ROOT","paragraphs":["Data Intelligence for Revenue Transformation.","DIRT represents one of ROOT's defining ambitions: to move healthcare revenue management beyond isolated reports and reactive work queues toward evidence-led operational intelligence.","It is not envisioned as technology for technology's sake.","Nor is it merely a dashboard with attractive charts.","DIRT is the embedded intelligence capability through which ROOT intends to connect financial and operational information, identify unusual patterns, expose revenue leakage, investigate payer behavior, prioritize interventions, and strengthen accountability.","Its purpose is to help answer questions that ordinary operational reporting often leaves unresolved:","Why is this revenue outstanding?","What created the problem?","Has the underlying issue occurred elsewhere?","Who owns the next action?","Which intervention has the highest expected value?","What evidence supports that decision?","And how will we know whether the action worked?","DIRT should help people arrive at better answers, not pretend human expertise is obsolete.","Its governing philosophy is:","AI accelerates. Humans judge. Evidence sells. Outcomes compound.","ROOT will automate what is repetitive and sufficiently understood.","It will support human judgment where decisions demand professional interpretation, ethical responsibility, or uncertainty management.","And it will preserve an auditable relationship between the information examined, the action taken, and the result achieved.","The ambition is not to remove humanity from healthcare operations. It is to remove unnecessary friction so that human expertise can be applied where it matters most."]},{"title":"The Relationship We Want With Healthcare Providers","paragraphs":["We reject the idea that a healthcare provider must become dependent on an opaque outsourcing organization to improve financial performance.","The provider should remain in control of the practice.","Its data.","Its patients.","Its clinical decisions.","Its financial interests.","Its technology choices.","ROOT's responsibility is to make that control more meaningful.","We must be willing to recommend improvements to the provider's existing EHR or practice management platform even when selling a replacement would create additional commercial opportunity.","We must be prepared to recommend a technology partner when the evidence supports that decision—and an alternative when it does not.","We must explain why an intervention is necessary, what it will cost, what it may achieve, and what risks it carries.","We must never confuse client dependence with client loyalty.","A provider should remain with ROOT because the relationship continuously creates value, not because the provider has lost the practical ability to leave.","Our ideal relationship is not that of a vendor and a captive customer.","It is that of an accountable operating partner and an informed healthcare organization."]},{"title":"The ROOT Standard","paragraphs":["ROOT's identity must eventually be visible in how its people work, not merely in how its leadership speaks.","We hold ourselves to eight institutional principles.","1. Investigate before assuming.","The visible symptom is not automatically the underlying cause. We examine evidence before designing interventions.","2. Own the outcome, not merely the task.","Completing an assigned activity has limited value when the problem remains unresolved. Responsibilities must connect to meaningful, measurable outcomes.","3. Tell the truth even when it is commercially inconvenient.","We must not manufacture performance statistics, misrepresent certifications, exaggerate recovery opportunities, or recommend services the evidence does not justify.","4. Make the invisible visible.","Unresolved claims, missing information, workflow gaps, financial exceptions, and unanswered responsibilities should not remain hidden inside spreadsheets, inboxes, or institutional memory.","5. Respect the people doing the work.","Healthcare administration is difficult and often undervalued. Technology should help capable professionals make better decisions, reduce unnecessary effort, and develop their expertise.","6. Protect trust as operational infrastructure.","Privacy, confidentiality, appropriate access, accurate reporting, and responsible handling of sensitive healthcare information are foundational requirements, not optional marketing features.","7. Remain independent in our judgment.","Vendor relationships, platform preferences, and commercial incentives must not override our obligation to recommend what best serves the healthcare organization.","8. Improve the system, not just the immediate result.","Every recurring operational failure is an opportunity to make the next occurrence less likely, easier to identify, or less costly to resolve."]},{"title":"What ROOT Refuses to Become","paragraphs":["ROOT will not define its value primarily through inexpensive labor.","It will not confuse headcount with capability.","It will not sell artificial intelligence as a substitute for healthcare expertise.","It will not build an impressive technology facade around weak service delivery.","It will not present ambitions, planned features, or unverified outcomes as existing accomplishments.","It will not demand unnecessary migrations simply to create proprietary dependency.","It will not exploit the complexity of healthcare reimbursement to make clients less informed about their own operations.","And it will not sacrifice the quality of its existing commitments merely to appear larger than it is.","The company must earn the right to expand.","Credibility comes before scale. Evidence comes before claims. Delivery comes before reputation."]},{"title":"The Future We Intend to Help Create","paragraphs":["Our long-term vision is a healthcare revenue environment in which organizations no longer depend primarily on discovering problems after they have already become expensive.","A future in which administrative and financial systems can identify emerging operational risk, detect patterns of preventable revenue loss, and equip professionals to intervene earlier.","A future in which a practice manager can understand the financial and operational health of the organization without reconciling disconnected reports.","A future in which credentialing, reimbursement, practice management, analytics, and operational execution are coordinated instead of isolated.","A future in which automation makes healthcare administration more understandable and manageable—not more opaque.","ROOT intends to contribute to that future by building from real operational problems upward.","Beginning with measurable improvements for individual practices.","Earning trust through accountable delivery.","Converting recurring knowledge into repeatable systems.","Embedding intelligence where it improves work.","And gradually developing a technology-enabled healthcare operating model that can serve increasingly complex organizations.","Our ambition is to help define a more intelligent category of healthcare operations partner.","We do not claim that this future already exists.","We intend to help build it, one validated improvement at a time."]},{"title":"The Founder's Commitment","paragraphs":["ROOT is more than a commercial undertaking.","It represents the belief that years spent inside imperfect systems should eventually produce something better than expertise in navigating those imperfections.","It is a commitment to turn practical experience into lasting institutional capability.","To transform knowledge into systems.","To transform frustration into better design.","To transform individual problem-solving into repeatable organizational intelligence.","And to create a company whose value does not depend indefinitely on the extraordinary effort of one individual.","That final responsibility matters.","ROOT cannot fulfill its founding philosophy if every significant decision, correction, innovation, and client relationship must ultimately return to its founder.","The founder's job is not merely to become indispensable.","It is to establish standards, people, processes, and systems capable of preserving the mission without constant personal intervention.","The measure of success will not be how much complexity ROOT can absorb.","It will be how much unnecessary complexity ROOT can eliminate while improving financial outcomes, strengthening client trust, and developing its people.","The ambition is substantial.","The method must remain practical.","And the responsibility to deliver is continuous."]},{"title":"Our Declaration","paragraphs":["We are ROOT.","We believe that healthcare organizations deserve more than fragmented systems, reactive billing, and explanations that never lead to lasting improvements.","We believe financial performance should be understood, not merely reported.","We believe problems should be investigated at their source.","We believe technology should strengthen professional judgment.","We believe outsourcing should improve control, not remove it.","We believe people deserve systems that make their work more meaningful and effective.","We believe that the best operational intelligence does not simply reveal what happened—it helps people determine what must happen next.","We believe that expertise earns trust through evidence.","That accountability creates confidence.","That improvement must be measurable.","And that sustainable progress comes from fixing causes rather than repeatedly treating symptoms.","We will remain curious enough to question established practices.","Disciplined enough to validate our ideas.","Independent enough to tell clients uncomfortable truths.","And persistent enough to pursue problems beyond their obvious explanations.","We are not here merely to manage the healthcare revenue cycle as it exists.","We are here to help build what healthcare revenue operations should become.","ROOT Fix the system behind your revenue.","Where Revenue Cycle Management Meets Data Intelligence."]}];

function v5AppHeader(){let t=v5Tenant();return `<div class="v5-app-top"><div class="v5-tenant-label"><small>${E('CURRENT ORGANIZATION','ORGANIZACIÓN ACTUAL')}</small><label><span class="sr-only">${E('Switch sample organization','Cambiar organización de ejemplo')}</span><select data-v5select="tenant">${V5_TENANTS.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><span class="v5-roleline">${esc(t.specialty)} · ${t.providers} ${E('providers','profesionales')} · ${esc(t.state)}</span></div><div class="v5-app-controls"><label>${E('VIEW AS','VER COMO')} <select data-v5select="role">${V5_ROLESET.map(x=>`<option value="${x[0]}" ${x[0]===state.v5Role?'selected':''}>${E(x[1],x[2])}</option>`).join('')}</select></label><button class="toggle" data-act="language" aria-label="Language">${state.lang==='en'?'EN / ES':'ES / EN'}</button><button class="toggle" data-act="theme" aria-label="Theme">${state.theme==='dark'?'☼':'☾'}</button></div></div>`}
function v5Aside(){const groups=V5_GROUPS.map(([en,es,routes])=>`<div class="v5-group-title">${E(en,es)}</div>${routes.map(id=>{let m=V5_MODULE_ROUTES[id];return `<button class="v5-aside-link ${state.page===id?'on':''}" data-nav="${id}"><span>${m?E(m[2],m[3]):id==='settings'?E('Preferences','Preferencias'):E('Employee operations','Operaciones internas')}</span>${m?v5PillAccess(m[4]):''}</button>`}).join('')}`).join('');return `<aside class="v5-aside"><div class="v5-aside-brand">${brand()}<small>ROOT / ${E('WORKSPACE','ESPACIO')}</small></div>${v5SuiteStrip()}<nav class="v5-aside-nav" aria-label="${E('Workspace navigation','Navegación del espacio')}">${groups}</nav><div class="v5-aside-bottom"><strong>${esc(v5Tenant().short)}</strong><small>${E('Identity simulation · no patient records','Simulación de identidad · sin datos de pacientes')}</small><button data-nav="home" class="v5-aside-link">↖ ${E('Public website','Sitio público')}</button></div></aside>`}
function v5AppShell(page){return `<div class="v5-shell">${v5Aside()}<div class="v5-shell-main">${v5AppHeader()}<main id="main-content" class="v5-shell-content">${v5ModuleContent(page)}</main></div></div>`}
function v5Metric(name,es,val,detail){return `<div class="v5-mini-kpi"><span>${E(name,es)}</span><strong>${val}</strong><small>${E(detail,'Valor ilustrativo')}</small></div>`}
function v5ModuleContent(page){const tenant=v5Tenant(),mod=V5_MODULE_ROUTES[page];if(page==='settings')return v5Settings();if(page==='employeehub')return v5EmployeeHub();if(page==='dashboard')return v5Dashboard();if(page==='servicehub')return v5ServiceHub();if(page==='teamportal')return v5TeamPortal();if(page==='tasks')return v5TaskBoard();if(page==='account')return v5Account();
 const defaultPage={denials:denials,credentialing:credentialing,reports:reports}[page];if(defaultPage){return `<div class="v5-module-banner">${v5PillAccess(mod?.[4]||'growth')} <span>${esc(tenant.name)} · ${E('selected synthetic organization','organización sintética seleccionada')}</span></div>${!v5Allowed(page)?v5Locked(page):defaultPage()}`}
 if(!mod)return v5Dashboard();return `<div class="v5-module-header"><span class="overline">${v5PillAccess(mod[4])} · ${E('OPERATIONAL MODULE','MÓDULO OPERATIVO')}</span><h1>${E(mod[2],mod[3])}</h1><p>${E(mod[5],mod[5])}</p></div>${!v5Allowed(page)?v5Locked(page):v5GenericModule(mod)}`}
function v5Locked(page){const p=V5_MODULE_ROUTES[page];return `<div class="v5-locked"><span aria-hidden="true">◇</span><h2>${E('Preview the workflow. Unlock access with your plan.','Vea el flujo. Desbloquee el acceso con su plan.')}</h2><p>${E('This capability is not included in the currently selected organization tier. Preview the operating model or request a scoped plan; no charge or authorization is created here.','Esta capacidad no está incluida en el nivel seleccionado. Puede consultar el alcance sin generar ningún cargo.')}</p><div>${p?v5PillAccess(p[4]):''}</div>${link(E('Compare service tiers','Comparar planes de servicio'),'pricing','btn')}${link(E('Ask about availability','Consultar disponibilidad'),'proposal','btn secondary')}</div>`}
function v5Dashboard(){const t=v5Tenant();return `<div class="v5-module-header"><span class="overline">${E('ORGANIZATION INTELLIGENCE','INTELIGENCIA DE LA ORGANIZACIÓN')}</span><h1>${E('Your revenue operations, in clear view.','Sus operaciones de ingresos, con claridad.')}</h1><p>${esc(t.name)} — ${t.kind} · ${t.providers} ${E('providers','profesionales')} · ${t.locations} ${E('locations','sedes')}. ${E('Synthetic scenario, not a real client account.','Escenario ficticio, no es una cuenta real.')}</p></div><div class="v5-kpi-grid">${v5Metric('Monthly billed charges','Cargos mensuales','$'+t.monthly.toLocaleString('en-US'),'Illustrative operating volume')}${v5Metric('Open A/R','CxC abierta','$'+t.ar.toLocaleString('en-US'),'Illustrative open balance')}${v5Metric('Denial rate','Tasa de denegación',t.denial+'%','Illustrative claim mix')}${v5Metric('Days in A/R','Días en CxC',t.aging,'Illustrative collection lag')}</div>${v5SuiteStrip()}<div class="v5-dashboard-duo"><section class="card"><div class="sectionhead"><div><span class="overline">${E('SERVICE COVERAGE','COBERTURA DE SERVICIOS')}</span><h2>${E('Explore the full operating suite','Explore la suite operativa completa')}</h2></div></div><div class="v5-module-grid">${V5_MODULES.slice(0,12).map(m=>`<button class="v5-module-tile" data-nav="${m[1]}"><strong>${E(m[2],m[3])}</strong>${v5PillAccess(m[4])}</button>`).join('')}</div></section><section class="card"><span class="overline">${E('PRIORITY FEED','FLUJO PRIORITARIO')}</span><h2>${E('The next best action starts with ownership.','La siguiente acción empieza con un responsable.')}</h2><div class="v5-feed">${V5_ACTIVITIES.slice(0,5).map((r,i)=>`<button class="v5-feed-row" data-nav="${i===1?'credentialing':i===3?'payments':i===4?'patientfinance':'denials'}"><span><b>${esc(r[0])}</b><small>${esc(r[1])} · ${esc(r[2])}</small></span><span>${esc(r[3])} <em>→</em></span></button>`).join('')}</div>${link(E('Review assigned requests','Revisar solicitudes asignadas'),'tasks','btn secondary')}</section></div><div class="v5-privacy-note">${E('Scenario fixtures only: names, practices and financial values are fictional. Real customer environments require Appwrite organization isolation, role authorization and audit trails.','Solo escenarios ficticios. Los entornos reales requieren aislamiento por organización, permisos y auditoría.')}</div>`}
function v5ServiceHub(){return `<div class="v5-module-header"><span class="overline">${E('CAPABILITY DIRECTORY','DIRECTORIO DE CAPACIDADES')}</span><h1>${E('One operating suite. Clear service boundaries.','Una suite operativa. Alcances claros.')}</h1><p>${E('Inspect sixteen service workflows, their likely dependencies, and the tier that would unlock them. Contracting and availability are confirmed individually.','Explore flujos de servicios, dependencias y el nivel requerido. Los alcances se confirman individualmente.')}</p></div><div class="v5-module-grid v5-module-grid-wide">${V5_MODULES.map(m=>`<article class="v5-suite-card"><div><span class="overline">${m[0].toUpperCase()}</span>${v5PillAccess(m[4])}</div><h3>${E(m[2],m[3])}</h3><p>${m[5]}</p><button class="btn secondary" data-nav="${m[1]}">${E('Inspect workflow →','Ver flujo →')}</button></article>`).join('')}</div>`}
function v5GenericModule(mod){const t=v5Tenant();const sample=V5_ACTIVITIES.slice(0,4);return `<div class="v5-kpi-grid">${v5Metric('Open items','Pendientes',String(t.providers*3+4),'Planning illustration')}${v5Metric('Assigned ownership','Responsables',String(t.staff),'Planning illustration')}${v5Metric('Follow-up window','Próximo seguimiento','48h','Example service target')}${v5Metric('Process state','Estado del proceso',E('Review','Revisión'),'Not a live queue')}</div><div class="v5-dashboard-duo"><article class="card"><span class="overline">${E('WORKFLOW CONTROL CENTER','CENTRO DE CONTROL')}</span><h2>${E(mod[2],mod[3])}</h2><p>${esc(mod[5])}</p><ol class="v5-steps"><li>${E('Confirm data access and current operating baseline.','Confirme el acceso y la línea de base.')}</li><li>${E('Assign the practice owner and establish evidence checks.','Asigne responsables y verifique evidencia.')}</li><li>${E('Review exceptions, deadlines and next actions.','Revise incidencias, plazos y próximas acciones.')}</li><li>${E('Document the outcome and adjust the source process.','Documente el resultado y corrija el proceso.')}</li></ol><button class="btn" data-act="v5Request" data-val="${mod[1]}">${E('Request an implementation review','Solicitar revisión de implementación')}</button></article><article class="card"><span class="overline">${E('SAMPLE OPERATIONS QUEUE','COLA DE EJEMPLO')}</span><h2>${E('Actionable, not just reported.','Acciones, no solo informes.')}</h2><div class="v5-feed">${sample.map(r=>`<div class="v5-feed-row"><span><b>${esc(r[0])}</b><small>${esc(r[2])} / ${esc(r[1])}</small></span><small>${esc(r[4])}</small></div>`).join('')}</div></article></div>`}
function v5TaskBoard(){return `<div class="v5-module-header"><span class="overline">${E('ASSIGNMENTS & SERVICE REQUESTS','TAREAS Y SOLICITUDES')}</span><h1>${E('Every next step has an owner.','Cada siguiente paso tiene responsable.')}</h1><p>${E('A working demonstration of task ownership and completion status. Nothing is written to a remote CRM.','Demostración de tareas y estados. No se envían datos a un CRM.')}</p></div><div class="v5-task-list">${V5_ACTIVITIES.map((r,i)=>`<label class="v5-task"><input type="checkbox" data-v5task="${i}" ${state.v5TasksDone.includes(i)?'checked':''}><div><b>${E(r[0],r[0])}</b><span>${r[1]} · ${r[2]} · ${r[4]} · ${r[3]}</span></div><em class="${state.v5TasksDone.includes(i)?'v5-done':''}">${state.v5TasksDone.includes(i)?E('Completed','Completado'):E('Open','Abierto')}</em></label>`).join('')}</div><button class="btn secondary" data-act="v5Request" data-val="tasks">${E('Request another service task','Solicitar otra tarea')}</button>`}
function v5TeamPortal(){return `<div class="v5-module-header"><span class="overline">${E('MEMBERSHIP / ROLE MODEL','MEMBRESÍAS Y ROLES')}</span><h1>${E('Invite colleagues without exposing another practice.','Invite al equipo sin exponer otra práctica.')}</h1><p>${E('Illustrative Appwrite organization and role architecture. All memberships below are fictional.','Modelo ilustrativo de miembros y permisos en Appwrite.')}</p></div><div class="v5-module-grid v5-module-grid-wide">${V5_ROLESET.map((r,i)=>`<article class="card v5-role-card"><span class="overline">ROLE 0${i+1}</span><h3>${E(r[1],r[2])}</h3><p>${E('Access to selected services follows the member’s organization and approved role; no global access is implied.','El acceso depende de la organización y el rol aprobado.')}</p>${v5PillAccess(i===0?'free':'growth')}</article>`).join('')}</div><div class="card"><h3>${E('Invite a teammate','Invitar a una persona')}</h3><form id="v5-invite" class="v5-inline-form"><label>${E('Work email','Correo laboral')} <input type="email" name="email" placeholder="colleague@practice.com" required></label><label>${E('Role','Rol')} <select name="role">${V5_ROLESET.map(r=>`<option>${E(r[1],r[2])}</option>`).join('')}</select></label><button type="submit" class="btn">${E('Simulate invitation','Simular invitación')}</button></form><small>${E('No invitation email is sent in the prototype.','No se envía ningún correo en este prototipo.')}</small></div>`}
function v5EmployeeHub(){return `<div class="v5-module-header"><span class="overline">${E('ROOT INTERNAL OPERATIONS / SEPARATE IDENTITY BOUNDARY','OPERACIONES INTERNAS / ACCESO SEPARADO')}</span><h1>${E('Employee operations console','Consola de operaciones del equipo')}</h1><p>${E('This is a visual employee workspace. Real ROOT employee accounts must have independent authorization, no inferred client membership, strict need-to-know scopes, and audit logs.','Espacio visual para el equipo. Los accesos reales requieren permisos independientes y auditoría.')}</p></div><div class="v5-kpi-grid">${v5Metric('Assigned work queues','Colas asignadas','8','Synthetic')}${v5Metric('Escalations awaiting review','Escalaciones pendientes','3','Synthetic')}${v5Metric('Open payer tickets','Consultas a pagadores','21','Synthetic')}${v5Metric('Document QA requests','Solicitudes documentales','7','Synthetic')}</div><div class="v5-dashboard-duo"><article class="card"><h2>${E('Staff priorities','Prioridades del equipo')}</h2><div class="v5-feed">${V5_ACTIVITIES.map(x=>`<div class="v5-feed-row"><span><b>${x[0]}</b><small>${x[1]} · ${x[2]}</small></span><small>${x[4]}</small></div>`).join('')}</div></article><article class="card"><h2>${E('Role-based safeguards','Salvaguardas por rol')}</h2><ol class="v5-steps"><li>${E('Authorized team-to-client assignment required.','Se requiere asignación autorizada al cliente.')}</li><li>${E('Escalation approvals are attributable to named staff.','Las aprobaciones se atribuyen a personal identificado.')}</li><li>${E('No unrestricted multi-tenant record access.','No hay acceso irrestricto entre organizaciones.')}</li><li>${E('Sensitive fields must be withheld until compliant systems exist.','Los datos sensibles se restringen hasta tener sistemas adecuados.')}</li></ol></article></div>`}
function v5Account(){let t=v5Tenant();return `<div class="v5-module-header"><span class="overline">${E('ORGANIZATION ADMINISTRATION','ADMINISTRACIÓN DE ORGANIZACIÓN')}</span><h1>${E('Membership, subscriptions and access','Miembros, suscripciones y acceso')}</h1><p>${E('Your chosen tenant determines the sample commercial tier. HubSpot, Stripe and Appwrite are not connected.','La organización de ejemplo determina el plan. HubSpot, Stripe y Appwrite no están conectados.')}</p></div><div class="v5-dashboard-duo"><article class="card"><h2>${esc(t.name)}</h2><p>${esc(t.kind)} · ${t.providers} ${E('providers','profesionales')} · ${esc(t.state)}</p>${v5PillAccess(t.plan==='Free'?'free':t.plan==='Growth'?'growth':'managed')}<div class="v5-feed-row"><span><b>${E('Subscription owner','Titular de suscripción')}</b><small>${esc(t.owner)}</small></span><span>${E('Preview','Vista previa')}</span></div>${link(E('View canonical pricing','Consultar precios'),'pricing','btn')}</article><article class="card"><h2>${E('Account permissions','Permisos de cuenta')}</h2><p>${E('Users and roles are scoped to an individual organization; enterprise staff access is governed independently.','Los usuarios y roles se limitan a cada organización.')}</p>${V5_ROLESET.map(x=>`<span class="v5-role-chip">${E(x[1],x[2])}</span>`).join('')}${link(E('View team permissions →','Ver permisos del equipo →'),'teamportal','btn secondary')}</article></div>`}
function v5Settings(){return `<div class="v5-module-header"><h1>${E('Workspace preferences','Preferencias del espacio')}</h1><p>${E('Theme and language apply across the public site and the client portal. Preferences persist in this browser only.','El tema y el idioma se aplican a toda la web y a la aplicación.')}</p></div><div class="v5-dashboard-duo"><div class="card"><h2>${E('Display','Pantalla')}</h2><button class="btn secondary" data-act="theme">${E('Switch light / dark','Cambiar claro / oscuro')}</button> <button class="btn secondary" data-act="language">${E('Switch English / Spanish','Cambiar inglés / español')}</button></div><div class="card"><h2>${E('Security preferences','Preferencias de seguridad')}</h2><p>${E('In production: multi-factor authentication, user sessions, device reviews and sign-in audit log.','En producción: verificación multifactor, sesiones y auditoría de acceso.')}</p><p>${E('These settings are design requirements, not activated security services.','Estos controles son requisitos de diseño, no servicios activados.')}</p></div></div>`}
function v5SignIn(){return `${title(E('ONE PLATFORM · DISTINCT IDENTITIES','UNA PLATAFORMA · IDENTIDADES SEPARADAS'),E('Choose your ROOT workspace.','Elija su espacio ROOT.'),E('Explore client and employee journeys. Google, Microsoft and email are visual authentication choices only; no account or CRM record is created.','Explore acceso de clientes y empleados. Los métodos de autenticación son ilustrativos.'))}<section class="section slim"><div class="wrap v5-auth-layout"><div class="card v5-login"><div class="v5-login-mode" role="group" aria-label="Workspace access type"><button class="v5-filter ${state.v5Identity==='client'?'active':''}" data-act="v5Identity" data-val="client">${E('Client / Practice','Cliente / Práctica')}</button><button class="v5-filter ${state.v5Identity==='employee'?'active':''}" data-act="v5Identity" data-val="employee">${E('ROOT staff','Personal de ROOT')}</button></div><h2>${state.v5Identity==='client'?E('Access a practice workspace','Acceda al espacio de su práctica'):E('Access the ROOT employee console','Acceda a la consola del equipo ROOT')}</h2><p>${E('Use a fictional organization to preview permissions, service tiers and work queues.','Use una organización ficticia para explorar permisos, planes y tareas.')}</p><div class="v5-identity-options">${[['google','G','Continue with Google'],['microsoft','▦','Continue with Microsoft'],['email','@','Continue with email']].map(([id,mark,name])=>`<button class="v5-login-option ${state.v5LoginMethod===id?'selected':''}" data-act="v5LoginMethod" data-val="${id}"><span>${mark}</span> ${E(name,id==='google'?'Continuar con Google':id==='microsoft'?'Continuar con Microsoft':'Continuar con correo')}</button>`).join('')}</div><form id="v5-login-form"><label>${E('Work email','Correo laboral')} <input name="email" type="email" autocomplete="email" placeholder="name@practice.com" required></label><button class="btn" type="submit">${E('Explore sample workspace','Explorar espacio de ejemplo')} →</button></form><small>${E('No password, OAuth token, external sign-in or personal information is stored or transmitted.','No se guardan ni envían contraseñas, tokens ni información personal.')}</small></div><div class="v5-auth-context"><span class="overline">${E('ACCESS & TRUST','ACCESO Y CONFIANZA')}</span><h2>${E('Right work. Right organization. Right level of access.','Trabajo correcto. Organización correcta. Acceso adecuado.')}</h2><p>${E('Client administrators manage practice membership. ROOT employees receive independently authorized assignments. Providers and auditors see only the parts of the practice they are allowed to view.','Los administradores controlan miembros. El equipo ROOT requiere asignaciones independientes y autorizadas.')}</p><div class="v5-kpi-grid">${v5Metric('Identity providers','Proveedores de identidad','03','Planned methods')}${v5Metric('Role models','Modelos de acceso','05','Planning fixtures')}</div><p class="note">${E('Production setup: Appwrite Auth + organization isolation + optional identity providers + server-side CRM synchronization.','Implementación futura: Appwrite Auth, aislamiento de organizaciones y sincronización segura con CRM.')}</p></div></div></section>`}
function v5Founder(){const chapters=V5_FOUNDER_CHAPTERS;return `${title(E('A MESSAGE FROM THE FOUNDER','MENSAJE DEL FUNDADOR'),E('The soul of ROOT.','El alma de ROOT.'),E('The convictions behind accountable healthcare revenue operations, practice independence and responsible data intelligence.','Los principios detrás de una operación de ingresos responsable y la independencia de las prácticas.'))}<section class="section slim"><div class="wrap"><div class="v5-statement-grid"><article class="card v5-letter"><span class="overline">${E('FOUNDER’S COMMITMENT','COMPROMISO DEL FUNDADOR')}</span><h2>${E('Fix the system behind your revenue.','Corrija el sistema detrás de sus ingresos.')}</h2><blockquote>${E('Activity is not accountability. Technology is not intelligence. And collecting revenue is not the same as building a healthy revenue operation.','Actividad no es responsabilidad. Tecnología no es inteligencia. Cobrar ingresos no equivale a construir una operación sólida.')}</blockquote><p>${E('ROOT exists to investigate the operational causes of avoidable revenue failure, connect people with evidence, and give healthcare professionals more control over the systems that shape their practice.','ROOT existe para investigar las causas de los problemas recurrentes, conectar personas con evidencia y dar más control a los profesionales.')}</p><div class="v5-signature">${E('Muhammad Aftab Shaukat · Co-founder','Muhammad Aftab Shaukat · Cofundador')}</div></article><div class="v5-founder-art">${v5Img('founder','story')}<div class="v5-art-note">${E('Founding philosophy · Editorial illustration','Filosofía fundacional · Ilustración editorial')}</div></div></div><div class="sectionhead v5-sectionhead"><div><span class="overline">${E('FULL INSTITUTIONAL DECLARATION','DECLARACIÓN INSTITUCIONAL COMPLETA')}</span><h2>${E('Twelve chapters. One operating philosophy.','Doce capítulos. Una filosofía operativa.')}</h2><p>${E('Open any chapter to read the original founder text. Chapters are preserved without rewriting the founder’s legal or ethical commitments.','Abra cada capítulo para leer el texto original de la filosofía del fundador.')}</p></div></div><div class="v5-chapters">${chapters.map((c,i)=>`<details ${i===0?'open':''}><summary><span>${String(i+1).padStart(2,'0')}</span><strong>${esc(c.title)}</strong><b aria-hidden="true">＋</b></summary><div class="v5-chapter-copy">${c.paragraphs.map(line=>`<p>${esc(line)}</p>`).join('')}</div></details>`).join('')}</div></div></section>`}
function v5Forms(){let groups=['all',...new Set(V5_FORMS.map(x=>x.group))],items=V5_FORMS.filter(x=>(state.v5FormCategory==='all'||x.group===state.v5FormCategory)&&(`${x.title} ${x.desc} ${x.group}`).toLowerCase().includes(state.v5FormSearch.toLowerCase()));return `${title(E('OFFICIAL SOURCE DOCUMENTS','DOCUMENTOS DE FUENTE OFICIAL'),E('Current forms should come from their issuer.','Los formularios vigentes deben provenir de su emisor.'),E('Access Medicare enrollment, patient financial notices, claims and appeals from CMS. Official source pages—not copied or modified blank forms—control the current editions and instructions.','Acceda a formularios Medicare desde CMS. Consulte la fuente oficial para versiones e instrucciones vigentes.'))}<section class="section slim"><div class="wrap"><div class="v5-alert"><strong>${E('Scope safeguard','Aviso de alcance')}:</strong> ${E('Use financial-liability forms only for their specified program and circumstances. Medicare notices are not general-purpose liability waivers, and CMS-1500 display copies are not submission-ready paper forms.','Utilice los avisos solo cuando correspondan. No son exenciones generales; copias de CMS-1500 no son formularios válidos para presentación.')} <a target="_blank" rel="noopener noreferrer" href="https://www.cms.gov/medicare/forms-notices/cms-forms-list">CMS Forms List ↗</a></div><div class="v5-filterbar"><label>${E('Find a form','Buscar formulario')} <input type="search" data-v5search="forms" value="${esc(state.v5FormSearch)}" placeholder="CMS-855B, ABN, appeals…"></label><label>${E('Filter by topic','Filtrar por tema')} <select data-v5select="formCategory">${groups.map(x=>`<option value="${esc(x)}" ${state.v5FormCategory===x?'selected':''}>${x==='all'?E('All official forms','Todos los formularios'):esc(x)}</option>`).join('')}</select></label></div><div class="v5-media-grid" id="v5-forms-grid">${items.map(x=>v5FormCard(x)).join('')||`<div class="card">${E('No matching official forms.','No se enc function render(){document.documentElement.lang=state.lang;document.body.dataset.theme=state.theme;document.title="ROOT V2 — Interactive Browser Demo 6";const fn={home:v5Home,services:()=>v4Services()+v4Competence(),solutions:solutionsExplorerV3,team:v5Team,commercial:v4Pricing,consultation:consultationPageV3,checkout:checkoutPageV3,proposal:proposalPageV3,industries:v4Industries,platform:platform2,proof:v5Proof,resources:v4Guides,partnerships:v5Partners,careers:v5Careers,company:v5Company,security:v4Security,pricing:v4Pricing,contact:v5Contact,enrollment:v4Enrollment,gate:v4Gate,thanks:v4Thanks,privacy:v4Policy,terms:v4Policy,refunds:v4Policy,cookies:v4Policy,partnerGuidelines:v4Policy,faqs:v4Policy,assessment,signup,onboarding,ready,how:how2,design:design2,social:social2,cases:()=>v5EvidenceCards("case"),success:()=>v5EvidenceCards("success")};Object.assign(fn,{forms:v5Forms,templates:v5Templates,founder:v5Founder,sitemap:v5Sitemap,signin:v5SignIn});const view=APP_PAGES.has(state.page)?v5AppShell(state.page):(fn[state.page]||v5Home)();app.innerHTML=`<a class="skip" href="#main-content">${E('Skip to content','Saltar al contenido')}</a>${!APP_PAGES.has(state.page)?v5Header():''}${!APP_PAGES.has(state.page)?`<main id="main-content">${view}${v5EditorialBlock()}</main>`:view}${!APP_PAGES.has(state.page)?v5Footer():''}${modal()}${chatShellV3()}${v4CookieBanner()}<div id="toast" aria-live="polite"></div>`;v5SEOAfter();v6AfterRender()}

function saveCSV(){const rows=[['id','payer','issue','age_days','owner','priority'],...CLAIMS.map(x=>[x[0],x[1],x[2],x[4],x[5],x[6]])];const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ROOT_V2_Synthetic_Claims.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

case'v3chatToggle':state.v3ChatOpen=!state.v3ChatOpen;render();break;case'v3chatTopic':{const sample={services:E('Tell me about services','Cuénteme de los servicios'),integrations:E('Can I keep my EHR?','¿Puedo conservar mi EHR?'),plans:E('Show commercial plans','Muestre los planes'),contact:E('Can I speak with ROOT?','¿Puedo hablar con ROOT?')}[val];v3sendMessage(sample||val);break;}case'v3service':state.v3Service=val;render();break;case'v3entry':{const entry=ENTRY_PATHS_V3.find(x=>x[0]===val);state.selectedPlan=val==='recurring'?'Growth':val==='diagnostic'?'Diagnostic':val==='custom'?'Custom':'Explorer';navigate(entry?entry[5]:'commercial');break;}case'v3chatRoute':if(state.v3SuggestedRoute)navigate(state.v3SuggestedRoute);break;case'proofTab':state.proofTab=val;render();break;case'designTab':state.designTab=Number(val);render();break;case'lifecycle':state.lifecycle=Number(val);render();break;case'autoCarousel':state.autoCarousel=!state.autoCarousel;render();break;case'proofNext':{const rail=document.querySelector('[data-rail]');if(rail)rail.scrollBy({left:Math.max(260,rail.clientWidth*.7)*(val==='prev'?-1:1),behavior:'smooth'});break;}case'language':state.lang=state.lang==='en'?'es':'en';persist();render();break;case'theme':state.theme=state.theme==='dark'?'light':'dark';persist();render();break;case'menu':state.menu=!state.menu;render();break;case'nav':navigate(val);break;case'step':state.step=Number(val);render();break;case'persona':state.persona=Number(val);render();break;case'specialty':state.specialty=Number(val);render();break;case'chartMode':state.chartMode=val;render();break;case'queueFilter':state.filter=val;render();break;case'claim':state.selectedClaim=val;render();break;case'integrationCategory':state.integrationCategory=val;render();break;case'resourceType':state.resourceType=val;render();break;case'article':case'careerInfo':case'partnerInfo':case'proofInfo':state.modal={type:which,value:val};render();break;case'close':case'closeOverlay':state.modal=
