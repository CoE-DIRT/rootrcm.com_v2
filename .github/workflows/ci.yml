name: ROOT V2 CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Bootstrap uses npm install because a lockfile cannot be generated in this session.
      # After first validated local npm install, commit package-lock.json, change to npm ci and enable setup-node cache.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
