# quality remains the merge-gate job. Do not weaken protect-main from this workflow.
# Isolated HTTPS preview is not deployed here (see docs/engineering/commercial-launch/).
name: ROOT V2 CI
on:
  pull_request:
    branches: [main, 'feat/**', 'fix/**']
  push:
    branches: [main, 'feat/**', 'fix/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Node 20 action runtime is deprecated
# (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
# Keep checkout/setup-node at SHA-pinned v4 so npm cache keys stay stable. Follow-up
# bump to node24-native v5+ is a dedicated cache-key change, not this slice.
# App toolchain stays Node 22 (not the action runtime).
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Forbid committed .env.local
        run: |
          matches="$(git ls-files | grep -E '(^|/)\.env\.local$' || true)"
          if [ -n "$matches" ]; then
            echo '::error::.env.local must not be committed'
            echo "$matches"
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
