# Intentionally manually triggered until GitHub Settings > Security > Dependency graph is enabled.
# See issue #3. Restore the pull_request trigger once a successful run confirms support.
name: Dependency review (pending dependency graph)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
